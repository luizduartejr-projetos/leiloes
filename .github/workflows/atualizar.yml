name: Atualizar dados do portal

on:
  schedule:
    - cron: '0 11 * * *'  # Todo dia às 08:00 horário de Brasília (11:00 UTC)
  workflow_dispatch:       # Permite rodar manualmente pelo GitHub também

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install playwright beautifulsoup4 requests

      - name: Instalar navegadores do Playwright
        run: playwright install chromium --with-deps

      - name: Rodar scrapers
        run: python atualizar.py
        timeout-minutes: 30

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js meta.js enderecos_coords.js
          git diff --staged --quiet || git commit -m "Dados atualizados - $(date '+%d/%m/%Y %H:%M')"
          git push
